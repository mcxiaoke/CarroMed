# Robolectric 全局测试配置（T-5 / orsbf P2-21）
#
# 此前 34 个测试类只有 @Config(manifest = ...) 而未钉 SDK —— Robolectric 的
# 缺省 SDK 取自 targetSdk，targetSdk 升级时全部单测会在**无人知晓的情况下**
# 换一个模拟环境跑（行为差异静默发生，快照类测试最先变红）。
# 这里把缺省钉死在 35（= 当前 targetSdk / compileSdk）；
# 个别需要钉别的 SDK 的测试类（如快照测试 @Config(sdk=[34])，字体渲染要求
# 全员一致）的显式注解优先级高于本文件，不受影响。
sdk=35
